<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>منصة البطاقات الرقمية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🛍️ منصة البطاقات الرقمية</h1>
            <nav>
                <a href="index.html">الرئيسية</a>
                <a href="products.html">المنتجات</a>
                <a href="dashboard.html">لوحتي</a>
                <a href="deposit.html">شحن الرصيد</a>
                <a href="admin.html">الأدمن</a>
            </nav>
            <div id="user-info"></div>
        </div>
    </header>
    <main>
        <section class="hero">
            <h2>أسرع شحن للبطاقات والألعاب</h2>
            <p>Google Play, Steam, PUBG UC, Free Fire Diamonds</p>
            <button onclick="location.href='products.html'">تسوق الآن</button>
        </section>
        <section class="news-section">
            <h3>📢 آخر الأخبار والتنبيهات</h3>
            <div id="news-list"></div>
        </section>
        <div class="whatsapp-float">
            <a href="https://wa.me/1234567890?text=مرحباً، أحتاج مساعدة" target="_blank">💬 دردشة مع الأدمن</a>
        </div>
    </main>
    <script src="script.js"></script>
    <script>
        // تحديد رابط الـ Worker (غيّره إلى رابط الـ Worker الحقيقي)
        const WORKER_URL = 'https://gift-shop-api.aloby699.workers.dev';
        async function loadNews() {
            const res = await fetch(`${WORKER_URL}/api/news`);
            const news = await res.json();
            const container = document.getElementById('news-list');
            container.innerHTML = news.map(n => `<div class="news-item">📌 ${n.title} - ${new Date(n.date).toLocaleDateString('ar-EG')}</div>`).join('');
        }
        loadNews();
        checkAuth();
    </script>
</body>
</html>

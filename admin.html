<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة الأدمن</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>...</header>
    <main>
        <h2>إدارة الأخبار والتنبيهات</h2>
        <form id="news-form">
            <input type="text" id="newsTitle" placeholder="عنوان الخبر" required>
            <button type="submit">إضافة خبر</button>
        </form>
        <form id="alert-form">
            <input type="text" id="alertMsg" placeholder="رسالة تنبيه" required>
            <button type="submit">إضافة تنبيه</button>
        </form>
        <hr>
        <h2>طلبات الشحن اليدوي</h2>
        <div id="pending-deposits"></div>
        <h2>إدارة المنتجات</h2>
        <div id="products-admin"></div>
    </main>
    <script src="script.js"></script>
    <script>
        const WORKER_URL = 'https://floral-glitter-b7b.aloby699.workers.dev';
        async function loadPendingDeposits() {
            const res = await fetch(`${WORKER_URL}/api/admin/pending-deposits`);
            const deposits = await res.json();
            const container = document.getElementById('pending-deposits');
            container.innerHTML = deposits.map(d => `
                <div class="deposit-item">
                    المستخدم: ${d.userId}<br>المبلغ: ${d.amount} ${d.paymentMethod}<br>
                    الإيصال: <a href="${d.receiptUrl}" target="_blank">رابط</a>
                    <button onclick="approveDeposit('${d.id}')">موافقة</button>
                    <button onclick="rejectDeposit('${d.id}')">رفض</button>
                </div>
            `).join('');
        }
        async function approveDeposit(id) {
            await fetch(`${WORKER_URL}/api/admin/approve-deposit`, { method: 'POST', body: JSON.stringify({ id }), headers: { 'Content-Type': 'application/json' } });
            loadPendingDeposits();
        }
        async function rejectDeposit(id) {
            await fetch(`${WORKER_URL}/api/admin/reject-deposit`, { method: 'POST', body: JSON.stringify({ id }), headers: { 'Content-Type': 'application/json' } });
            loadPendingDeposits();
        }
        document.getElementById('news-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('newsTitle').value;
            await fetch(`${WORKER_URL}/api/admin/news`, { method: 'POST', body: JSON.stringify({ title }), headers: { 'Content-Type': 'application/json' } });
            alert('تمت الإضافة');
        });
        document.getElementById('alert-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('alertMsg').value;
            await fetch(`${WORKER_URL}/api/admin/alert`, { method: 'POST', body: JSON.stringify({ message: msg }), headers: { 'Content-Type': 'application/json' } });
            alert('تمت الإضافة');
        });
        loadPendingDeposits();
    </script>
</body>
</html>

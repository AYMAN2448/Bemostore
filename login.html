<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل دخول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><div class="container"><h1>تسجيل دخول</h1></div></header>
    <main>
        <form id="login-form">
            <input type="email" id="email" placeholder="البريد الإلكتروني" required>
            <button type="submit">دخول</button>
        </form>
        <div id="result"></div>
        <p>ليس لديك حساب؟ <a href="register.html">سجل الآن</a></p>
    </main>
    <script src="script.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
            const data = await res.json();
            if (data.userId) {
                localStorage.setItem('userId', data.userId);
                localStorage.setItem('userName', data.name);
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('result').innerText = data.error || 'البريد غير موجود';
            }
        });
    </script>
</body>
</html>
